configurations {
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
}

dependencies {
    developmentOnly "org.springframework.boot:spring-boot-devtools"
    implementation "org.postgresql:postgresql"
}

def profiles = "dev"
if (project.hasProperty("no-liquibase")) {
    profiles += ",no-liquibase"
}
if (project.hasProperty("tls")) {
    profiles += ",tls"
}

springBoot {
    buildInfo {
		properties {
			time = null
		}
	}
}

def postgresPort = project.findProperty("postgresPort") ?: "15433"
def postgresCompose = ["docker", "compose", "-f", "src/main/docker/postgresql.yml"]

// Spring Boot 2.1 has no spring-boot-docker-compose, so dev Postgres is managed by Gradle.
// Use -Pno-db-container to run against own database (POSTGRES_PORT env var sets the port).
task postgresUp(type: Exec) {
    group = "application"
    description = "Starts dev Postgres container"
    environment "POSTGRES_PORT", postgresPort
    commandLine postgresCompose + ["up", "-d", "--wait"]
}

task postgresDown(type: Exec) {
    group = "application"
    description = "Stops dev Postgres container"
    commandLine postgresCompose + ["down"]
}

bootRun {
    args = []
    environment "POSTGRES_PORT", postgresPort
    if (!project.hasProperty("no-db-container")) {
        dependsOn postgresUp
        finalizedBy postgresDown
    }
}


processResources {
    inputs.property('version', version)
    inputs.property('springProfiles', profiles)
    filesMatching("**/application.yml") {
        filter {
            it.replace("#project.version#", version)
        }
    }
    filesMatching("**/bootstrap.yml") {
        filter {
            it.replace("#spring.profiles.active#", profiles)
        }
    }
}

